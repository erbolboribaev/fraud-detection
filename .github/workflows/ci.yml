name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify Docker images build
        run: |
          docker build -f docker/Dockerfile.api -t fraud-api-ci .
          docker build -f docker/Dockerfile.stream -t fraud-stream-ci .
