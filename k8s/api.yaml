apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: api
          image: fraud-detection-api:latest
          imagePullPolicy: Never  # built locally into Docker Desktop's own daemon; never fetch from a registry
          env:
            - name: REDIS_HOST
              value: "redis"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fraud-detection
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
