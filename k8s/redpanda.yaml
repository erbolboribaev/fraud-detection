apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      enableServiceLinks: false
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          # Only the internal listener is needed: every client here (api,
          # generator, consumer, redpanda-console) is another pod in this
          # same cluster, reaching this one over the "redpanda" Service name.
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --node-id=0
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
          ports:
            - containerPort: 9092
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: fraud-detection
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
