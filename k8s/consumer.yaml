apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redpanda 9092; do echo waiting for redpanda; sleep 2; done"]
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z api 8000; do echo waiting for api; sleep 2; done"]
      containers:
        - name: consumer
          image: fraud-detection-consumer:latest
          imagePullPolicy: Never
          args:
            - src.consumer
            - --bootstrap=redpanda:9092
            - --api-url=http://api:8000
